version: 2

models:
  - name: silver_products
    description: "Clean product catalogue."
    columns:
      - name: product_id
        data_tests: [unique, not_null]
      - name: sku
        data_tests: [unique, not_null]

  - name: silver_orders
    description: "Clean orders, one row per order."
    columns:
      - name: order_id
        data_tests: [unique, not_null]
      - name: status
        data_tests:
          - accepted_values:
              values: ['paid', 'refunded']
      - name: channel
        data_tests:
          - accepted_values:
              values: ['online', 'megastore', 'matchday kiosk']

  - name: silver_order_lines
    description: "Enriched order lines."
    columns:
      - name: order_id
        data_tests: [not_null]
      - name: line_no
        data_tests: [not_null]
      - name: product_id
        data_tests: [not_null]